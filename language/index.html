<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Girl Who Went Missing</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .lang-title {
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #d8c9b0;
    margin: 0 0 3vh;
    font-style: italic;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .lang-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
  }
  .lang-buttons .cta {
    display: inline-block;
    min-width: 11rem;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="hero">
  <p class="lang-title">Choose your language &middot; Choisis ta langue</p>
  <div class="lang-buttons">
    <button type="button" class="cta" data-lang="en">English</button>
    <button type="button" class="cta" data-lang="fr">Fran&ccedil;ais</button>
  </div>
</div>

<script>
  var NEXT_URL = "../warning/";

  document.querySelectorAll("[data-lang]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      try { localStorage.setItem("lang", btn.getAttribute("data-lang")); } catch (e) {}
      window.location.href = NEXT_URL;
    });
  });
</script>

</body>
</html>
