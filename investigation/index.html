<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scene 1 — The Girl Who Went Missing</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .slideshow {
    position: relative;
    min-height: 100svh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #05070a;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  .slide img {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Placeholder visuel tant que les vraies images ne sont pas prêtes */
  .slide-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14171d;
    color: #4a4438;
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Boîte de dialogue en bas, générique et réutilisable */
  .dialogue-box {
    position: absolute;
    bottom: 6vh;
    left: 5vw;
    right: 5vw;
    max-width: 46rem;
    margin: 0 auto;
    background: rgba(5, 7, 10, 0.85);
    border: 1px solid rgba(216, 201, 176, 0.3);
    border-radius: 4px;
    padding: 1.4rem 1.8rem;
    z-index: 5;
  }

  .dialogue-speaker {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #d8c9b0;
    margin-bottom: 0.5rem;
  }

  .dialogue-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #f2efe9;
  }

  .dialogue-text:empty {
    display: none;
  }

  /* Contrôles */
  .controls {
    position: absolute;
    bottom: 2vh;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5vw;
    z-index: 6;
  }

  .skip-btn {
    background: none;
    border: none;
    color: #a99c86;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0.6rem 0;
  }

  .skip-btn:hover {
    color: #f2efe9;
  }

  .next-btn {
    background: #d8c9b0;
    color: #05070a;
    border: none;
    padding: 0.7rem 2rem;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .next-btn:hover {
    background: #f2efe9;
  }

  .progress {
    position: absolute;
    top: 3vh;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 6;
  }

  .progress .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(216, 201, 176, 0.25);
    transition: background 0.3s ease;
  }

  .progress .dot.done {
    background: #d8c9b0;
  }
</style>
</head>
<body>

<div class="slideshow" id="slideshow">

  <div class="progress" id="progress"></div>

  <!-- Les slides sont générées par JS à partir du tableau SLIDES ci-dessous -->

  <div class="dialogue-box">
    <div class="dialogue-speaker" id="dialogue-speaker"></div>
    <div class="dialogue-text" id="dialogue-text"></div>
  </div>

  <div class="controls">
    <button class="skip-btn" id="skip-btn">Skip intro — I already read it</button>
    <button class="next-btn" id="next-btn">Next</button>
  </div>

</div>

<script>
  // ── Contenu du diaporama ──────────────────────────────────────
  // Remplace "img" par le vrai chemin une fois les images éditées,
  // ex: "../assets/images/scene1-01.jpg"
  // speaker/text peuvent être vides si l'image parle d'elle-même.
  var SLIDES = [
    { img: null, speaker: "", text: "" },
    { img: null, speaker: "ASHLEY", text: "Ah, Mike j'ai une piste pour l'affaire de la police de Copperdale. Ce sont les pires incapables qu'il m'ait été donné de voir !" },
    { img: null, speaker: "MIKE", text: "Bonjour à toi aussi, Ash…" },
    { img: null, speaker: "ASHLEY", text: "Oui… Bonjour. Vraiment, regarde moi toutes ces bavures." },
    { img: null, speaker: "MIKE", text: "Qu'est-ce que tu veux faire ?" },
    { img: null, speaker: "ASHLEY", text: "Je pense qu'il est temps de mettre les pieds là-bas, tu ne crois pas ?" },
    { img: null, speaker: "MIKE", text: "Tu veux mon avis en tant que rédacteur en chef ou en tant qu'ami ?" },
    { img: null, speaker: "ASHLEY", text: "Les deux ?" },
    { img: null, speaker: "MIKE", text: "En tant qu'ami… je pense que tu as un bon instinct. En tant que rédacteur en chef, je pense que tu perds ton temps." },
    { img: null, speaker: "ASHLEY", text: "Je pars demain à la première heure. Donne mes autres dossiers à Tim Gurnersson !" }
  ];

  var NEXT_SCENE_URL = "../motel/";

  // ── Moteur du diaporama ────────────────────────────────────────
  var current = 0;
  var slideshowEl = document.getElementById("slideshow");
  var speakerEl = document.getElementById("dialogue-speaker");
  var textEl = document.getElementById("dialogue-text");
  var progressEl = document.getElementById("progress");
  var nextBtn = document.getElementById("next-btn");
  var skipBtn = document.getElementById("skip-btn");

  // Génère les slides (image ou placeholder) une seule fois
  SLIDES.forEach(function (slide, i) {
    var div = document.createElement("div");
    div.className = "slide";
    div.id = "slide-" + i;

    if (slide.img) {
      var img = document.createElement("img");
      img.src = slide.img;
      img.alt = "";
      div.appendChild(img);
    } else {
      var ph = document.createElement("div");
      ph.className = "slide-placeholder";
      ph.textContent = "Image " + (i + 1) + " / " + SLIDES.length;
      div.appendChild(ph);
    }

    slideshowEl.insertBefore(div, slideshowEl.querySelector(".dialogue-box"));

    var dot = document.createElement("div");
    dot.className = "dot";
    progressEl.appendChild(dot);
  });

  function render() {
    document.querySelectorAll(".slide").forEach(function (el, i) {
      el.classList.toggle("active", i === current);
    });
    document.querySelectorAll(".dot").forEach(function (dot, i) {
      dot.classList.toggle("done", i <= current);
    });

    speakerEl.textContent = SLIDES[current].speaker;
    textEl.textContent = SLIDES[current].text;

    nextBtn.textContent = (current === SLIDES.length - 1) ? "Begin investigation" : "Next";
  }

  function goNext() {
    if (current < SLIDES.length - 1) {
      current++;
      render();
    } else {
      window.location.href = NEXT_SCENE_URL;
    }
  }

  nextBtn.addEventListener("click", goNext);
  skipBtn.addEventListener("click", function () {
    window.location.href = NEXT_SCENE_URL;
  });

  render();
</script>

</body>
</html>
