<script>

  var REPORT_DATA = {
    title: "Case File #21071994/M-B",
    subtitle: "Melissa Bliss - Missing Person - Status: Closed (Unsolved)",
    fr: { title: "Dossier n° 21071994/M-B", subtitle: "Melissa Bliss - Personne disparue - Statut : Classé (non élucidé)" },
    sections: [
      {
        heading: "Incident Report",
        body: "July 21st, 1994, 00:04 - A call is received reporting the disappearance of Melissa Bliss, 23, reported missing by her mother Jodie Merrick. Melissa worked at a gas station in the neighboring town and usually ran home through the forest connecting the two areas, finishing her shift around 10 p.m. Official search efforts did not begin until 48 hours later, on 07/23/1994.",
        fr: {
          heading: "Rapport d’incident",
          body: "21 juillet 1994, 00 h 04 - Un appel signale la disparition de Melissa Bliss, 23 ans, déclarée disparue par sa mère, Jodie Merrick. Melissa travaillait dans une station-service de la ville voisine et rentrait habituellement chez elle en courant à travers la forêt qui relie les deux localités, après avoir terminé son service vers 22 h. Les recherches officielles n’ont commencé que 48 heures plus tard, le 23/07/1994."
        }
      },
      {
        heading: "Jodie Merrick (46) - Mother",
        body: "Nurse. Describes a conflicted relationship between Melissa and her stepfather, Garret Merrick, following a recent remarriage.",
        note: "The stepfather. Interesting…",
        fr: {
          heading: "Jodie Merrick (46 ans) - Mère",
          body: "Infirmière. Décrit une relation conflictuelle entre Melissa et son beau-père, Garret Merrick, depuis un récent remariage.",
          note: "Le beau-père. Intéressant…"
        }
      },
      {
        heading: "Garret Merrick (52) - Stepfather",
        body: "Contractor. Confirms a distant relationship with Melissa, no open hostility. Describes Melissa and Seth's relationship as 'toxic.'",
        note: "Ah, so there was a boyfriend… but why is it Garret telling police Seth was toxic, and not Jodie?",
        fr: {
          heading: "Garret Merrick (52 ans) - Beau-père",
          body: "Entrepreneur en bâtiment. Confirme une relation distante avec Melissa, sans hostilité déclarée. Décrit la relation entre Melissa et Seth comme « toxique ».",
          note: "Ah, donc il y avait un petit ami… mais pourquoi est-ce Garret qui dit à la police que Seth était toxique, et pas Jodie ?"
        }
      },
      {
        heading: "Seth Fern (23) - Boyfriend",
        body: "Unemployed. Has known Melissa since childhood. Profile described as short-tempered and possessive. Admits to frequent arguments. Mentions a coworker (Leandro) he suspects of having feelings for Melissa. States Melissa always denied any relationship with him. Redirects investigators to Daphne Holzer for more information. Behavior during questioning: unusually composed.",
        note: "Unusually composed, apparently jealous and violent… Real son-in-law material, this one. (Sigh...)",
        fr: {
          heading: "Seth Fern (23 ans) - Petit ami",
          body: "Sans emploi. Connaît Melissa depuis l’enfance. Profil décrit comme colérique et possessif. Admet des disputes fréquentes. Mentionne un collègue (Leandro) qu’il soupçonne d’avoir des sentiments pour Melissa. Affirme que Melissa a toujours nié toute relation avec lui. Redirige les enquêteurs vers Daphne Holzer pour plus d’informations. Comportement pendant l’interrogatoire : étonnamment calme.",
          note: "Étonnamment calme, apparemment jaloux et violent… Le gendre idéal, celui-là. (Soupire...)"
        }
      },
      {
        heading: "Daphne Holzer (23) - Best Friend",
        body: "Waitress (evenings) and student (daytime). Close friend since childhood. Describes Seth as manipulative and jealous. Confirms Melissa mentioned Leandro Larozzi to her - alleged advances, unacknowledged mutual interest. According to Daphne, Melissa refused any relationship with Leandro because of how Seth would likely react.",
        note: "She knew more than she told the police. I'd bet my press badge on it.",
        fr: {
          heading: "Daphne Holzer (23 ans) - Meilleure amie",
          body: "Serveuse (le soir) et étudiante (la journée). Amie proche depuis l’enfance. Décrit Seth comme manipulateur et jaloux. Confirme que Melissa lui a parlé de Leandro Larozzi - avances présumées, attirance mutuelle non avouée. Selon Daphne, Melissa refusait toute relation avec Leandro à cause de la réaction probable de Seth.",
          note: "Elle en savait plus qu’elle ne l’a dit à la police. Je mettrais ma carte de presse en jeu."
        }
      },
      {
        heading: "Leandro Larozzi (25) - Coworker",
        body: "Gas station employee and student. Admits having feelings for Melissa. States she turned him down because of her relationship with Seth. Describes Seth as unstable and intrusive (frequent presence at her workplace). States he tried to offer Melissa moral support.",
        note: "Five people interviewed. Three of them point straight at Seth Fern…",
        fr: {
          heading: "Leandro Larozzi (25 ans) - Collègue",
          body: "Employé de la station-service et étudiant. Admet avoir des sentiments pour Melissa. Déclare qu’elle l’a repoussé à cause de sa relation avec Seth. Décrit Seth comme instable et envahissant (présence fréquente sur son lieu de travail). Déclare avoir essayé d’offrir un soutien moral à Melissa.",
          note: "Cinq personnes interrogées. Trois d’entre elles désignent directement Seth Fern…"
        }
      }
    ]
  };
  
  var BASE_LOCATIONS = [
    { type: "location", name: "The Factory", blurb: "Local Bar & Diner", fr: { blurb: "Bar et restaurant du coin" }, thumb: "../../assets/images/map-icon.jpg", url: "../bar-3/", current: true },
    { type: "location", name: "Copperdale National Forest", blurb: "", fr: { name: "Forêt Nationale de Copperdale" }, thumb: "../../assets/images/map-icon.jpg", url: "../forest-3/" },
    { type: "location", name: "Gas Station", blurb: "", fr: { name: "Station-service", blurb: "" }, thumb: "../../assets/images/map-icon.jpg", url: "../gas-station-3/" },
    { type: "location", name: "Copperdale Police Station", blurb: "", fr: { name: "Commissariat de Copperdale" }, thumb: "../../assets/images/map-icon.jpg", url: "../police-station-3/" }
  ];

  // UNLOCKED SLIDE 14
  var FERN_LOCATION = {
    type: "location", name: "Fern Auto Repair", blurb: "Closed on weekends",
    fr: { blurb: "Fermé le week-end" },
    thumb: "../../assets/images/map-icon.jpg",
    locked: true,
    isNew: true
  };
  var FERN_UNLOCK_INDEX = 14;

  var MOTEL_LOCATION = {
    type: "location", name: "Lake View Motel", blurb: "Where you're staying",
    fr: { blurb: "Là où vous logez" },
    thumb: "../../assets/images/map-icon.jpg",
    url: "../bar3-motel/",
    isNew: true
  };


  var MOTEL_CLOSED = {
    type: "location", name: "Lake View Motel", blurb: "Where you're staying",
    fr: { blurb: "Là où vous logez" },
    thumb: "../../assets/images/map-icon.jpg",
    locked: true
  };

  var GIFT_URL = "http://www.simfileshare.net/download/6328202/";
  var JUKEBOX_MESSAGES = [
    {
      type: "message",
      isNew: true,
      from: "ASHLEY",
      text: "You and your love of old things... look at this little marvel.",
      fr: { text: "Toi et ton amour des vieilles choses... regarde-moi cette petite merveille." },
      image: "../../assets/images/jukebox-preview.jpg",
      attachment: { label: "Put a coin in", fr: "Mets une pièce", url: GIFT_URL }
    },
    {
      type: "message",
      isNew: true,
      from: "MIKE",
      text: "THAT is exactly what my office is missing.",
      fr: { text: "C’est EXACTEMENT ce qui manque à mon bureau." }
    }
  ];

  var SLIDES = [

    { img: "../../assets/images/scene3-counter3-01.jpg", speaker: "PETE", text: "What brings you around here, hon? Don't get many new faces in this town!", fr: "Qu’est-ce qui vous amène par ici, ma belle ? On ne voit pas souvent de nouvelles têtes dans le coin !" },

    { img: "../../assets/images/scene3-counter3-02.jpg", speaker: "ASHLEY", text: "Oh, nothing much. Just an old missing persons case... hon.", fr: "Oh, pas grand-chose. Juste une vieille affaire de disparition... mon chou." },

    { img: "../../assets/images/scene3-counter3-03.jpg", speaker: "PETE", text: "Oh, you mean little Bliss, the one who disappeared back in '94? If you ask me, it was the stepfather! He showed up in town in '92 and wasted no time marrying Jodie Bliss, Melissa's mother. How they even met, no idea. Anyway, it's a secret he took to the grave with him.", fr: "Ah, vous parlez de la petite Bliss, celle qui a disparu en 94 ? Si vous voulez mon avis, c’est le beau-père ! Il est arrivé en ville en 92 et il n’a pas perdu de temps pour épouser Jodie Bliss, la mère de Melissa. Comment ils se sont rencontrés, aucune idée. Enfin, c’est un secret qu’il a emporté dans la tombe." },
    { img: "../../assets/images/scene3-counter3-03.jpg", speaker: "ASHLEY", text: "Great. A first lead that goes nowhere... off to a good start.", fr: "Génial. Une première piste qui ne mène nulle part... Ça commence bien.", tone: "mumble" },
    
    { img: "../../assets/images/scene3-counter3-04.jpg", speaker: "ASHLEY", text: "Hey...hmm...What's your name again...?", fr: "Dites... hmm... Comment vous vous appelez, déjà... ?" },

    { img: "../../assets/images/scene3-counter3-06.jpg", speaker: "PETE", text: "Pete. Name's Pete.", fr: "Pete. Je m’appelle Pete." },

    { img: "../../assets/images/scene3-counter3-04.jpg", speaker: "ASHLEY", text: "Right, Pete... Do you happen to know a Seth? Fern?", fr: "Très bien, Pete... Vous connaissez un certain Seth ? Fern ?" },

    { img: "../../assets/images/scene3-counter3-03.jpg", speaker: "PETE", text: "Oh, Fern, sure! He runs the garage, Fern Auto Repair. Oh... right, he and Melissa were together. Poor guy looked devastated when he found out she'd disappeared.", fr: "Ah, Fern, bien sûr ! C’est lui qui tient le garage, Fern Auto Repair. Ah... c’est vrai, lui et Melissa étaient ensemble. Le pauvre avait l’air dévasté quand il a appris sa disparition." },

    { img: "../../assets/images/scene3-counter3-07.jpg", speaker: "ASHLEY", text: "Devastated... I see.", fr: "Dévasté... je vois.", tone: "mumble" },

    { img: "../../assets/images/scene3-counter3-08.jpg", speaker: "ASHLEY", text: "And tell me, Pete, do you know if the garage is open tomorrow?", fr: "Et dites-moi, Pete, savez-vous si le garage est ouvert demain ?" },

    { img: "../../assets/images/scene3-counter3-09.jpg", speaker: "PETE", text: "Ah, got a little problem with your... ride?", fr: "Ah, un petit souci avec votre... carrosse ?" },

    { img: "../../assets/images/scene3-counter3-07.jpg", speaker: "ASHLEY", text: "Yeah... something like that.", fr: "Ouais... un truc dans le genre." },

    { img: "../../assets/images/scene3-counter3-02.jpg", speaker: "PETE", text: "Unfortunately, the garage is closed on weekends. But if it's an emergency, you can always go see Seth at his place. Hold on, I'll write it down for you.", fr: "Malheureusement, le garage est fermé le week-end. Mais si c’est une urgence, vous pouvez toujours aller voir Seth chez lui. Attendez, je vous écris son adresse." },
    { img: "../../assets/images/scene3-counter3-02.jpg", speaker: "PETE", text: "Here you go. Try not to get him too worked up. He's in the middle of a divorce...", fr: "Tenez. Essayez de ne pas trop l’énerver. Il est en plein divorce..." },

    { img: "../../assets/images/scene3-counter3-04.jpg", speaker: "ASHLEY", text: "Great... I'll do that, then. Thanks.", fr: "Super... Je ferai ça, alors. Merci." },

    { img: "../../assets/images/scene3-counter3-10.jpg", speaker: "ASHLEY", text: "It's been a long day. Time to head back to the motel.", fr: "La journée a été longue. Il est temps de rentrer au motel." }
  ];

  Lang.slides(SLIDES);

  var PHONE_IMG = "../../assets/images/phone-frame.png";

  initSlideshow(SLIDES, {
    nextUrl: "#",
    onSlideChange: function (index) {
      var isLast = index === SLIDES.length - 1;
      var items = [{ type: "report", label: "Case File #21071994", fr: { label: "Dossier n° 21071994" }, data: REPORT_DATA }].concat(BASE_LOCATIONS);
      var unlocked = index >= FERN_UNLOCK_INDEX;
      if (unlocked) items.push(FERN_LOCATION);
      if (isLast) {
        items.push(MOTEL_LOCATION);
        items = JUKEBOX_MESSAGES.concat(items);
      } else {
        items.push(MOTEL_CLOSED);
      }
      // Dernière slide : le drapeau "motel" ouvre le motel sur toutes les autres pages
      items = GameState.items(Lang.items(items), unlocked ? { flag: isLast ? ["fern", "motel"] : "fern" } : undefined);

      initPhoneOverlay(items, {
        hasNew: index === FERN_UNLOCK_INDEX || isLast,
        newCount: isLast ? 3 : 1,
        imgPath: PHONE_IMG
      });
    }
  });
</script>
