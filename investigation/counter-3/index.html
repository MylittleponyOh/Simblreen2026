<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counter — The Girl Who Went Missing</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/slideshow.css">
<link rel="stylesheet" href="../../assets/css/phone-overlay.css">
<link rel="stylesheet" href="../../assets/css/report-viewer.css">
</head>
<body>

<script src="../../assets/js/slideshow.js"></script>
<script src="../../assets/js/phone-overlay.js"></script>
<script src="../../assets/js/report-viewer.js"></script>
<script>

  var REPORT_DATA = {
    title: "Case File #21071994/M-B",
    subtitle: "Melissa Bliss — Missing Person — Status: Closed (Unsolved)",
    sections: [
      {
        heading: "Incident Report",
        body: "July 21st, 1994, 00:04 — A call is received reporting the disappearance of Melissa Bliss, 23, reported missing by her mother Jodie Merrick. Melissa worked at a gas station in the neighboring town and usually ran home through the forest connecting the two areas, finishing her shift around 10 p.m. Official search efforts did not begin until 48 hours later, on 07/23/1994."
      },
      {
        heading: "Jodie Merrick (46) — Mother",
        body: "Nurse. Describes a conflicted relationship between Melissa and her stepfather, Garret Merrick, following a recent remarriage.",
        note: "The stepfather. Interesting…"
      },
      {
        heading: "Garret Merrick (52) — Stepfather",
        body: "Contractor. Confirms a distant relationship with Melissa, no open hostility. Describes Melissa and Seth's relationship as 'toxic.'",
        note: "Ah, so there was a boyfriend… but why is it Garret telling police Seth was toxic, and not Jodie?"
      },
      {
        heading: "Seth Fern (23) — Boyfriend",
        body: "Unemployed. Has known Melissa since childhood. Profile described as short-tempered and possessive. Admits to frequent arguments. Mentions a coworker (Leandro) he suspects of having feelings for Melissa. States Melissa always denied any relationship with him. Redirects investigators to Daphne Holzer for more information. Behavior during questioning: unusually composed.",
        note: "Unusually composed, apparently jealous and violent… Real son-in-law material, this one. (She sighs.)"
      },
      {
        heading: "Daphne Holzer (23) — Best Friend",
        body: "Waitress (evenings) and student (daytime). Close friend since childhood. Describes Seth as manipulative and jealous. Confirms Melissa mentioned Leandro Larozzi to her — alleged advances, unacknowledged mutual interest. According to Daphne, Melissa refused any relationship with Leandro because of how Seth would likely react.",
        note: "She knew more than she told the police. I'd bet my press badge on it."
      },
      {
        heading: "Leandro Larozzi (25) — Coworker",
        body: "Gas station employee and student. Admits having feelings for Melissa. States she turned him down because of her relationship with Seth. Describes Seth as unstable and intrusive (frequent presence at her workplace). States he tried to offer Melissa moral support.",
        note: "Five people interviewed. Three of them point straight at Seth Fern…"
      }
    ]
  };

  var BASE_LOCATIONS = [
    { type: "location", name: "Bar & Diner", blurb: "Local hangout", thumb: "../../assets/images/map-icon.jpg", url: "../bar-3/" },
    { type: "location", name: "The Forest", blurb: "Her route home", thumb: "../../assets/images/map-icon.jpg", url: "../forest-3/" },
    { type: "location", name: "Gas Station", blurb: "Where Melissa worked", thumb: "../../assets/images/map-icon.jpg", url: "../gas-station-3/" },
    { type: "location", name: "Police Station", blurb: "Copperdale PD", thumb: "../../assets/images/map-icon.jpg", url: "../police-station-3/" }
  ];

  // Débloqué seulement quand Ashley récupère la serviette (index 14)
  var FERN_LOCATION = {
    type: "location", name: "Fern Auto Repair", blurb: "Closed on weekends",
    thumb: "../../assets/images/map-icon.jpg", url: "../fern-auto-repair-3/"
  };
  var FERN_UNLOCK_INDEX = 14;

  // Chaque réplique = sa propre slide (le texte précédent s'efface à chaque Next).
  // Même image réutilisée = même cadrage, juste une ligne différente.
  var SLIDES = [
    // 0 — Pete
    { img: "../../assets/images/scene3-counter3-01.jpg", speaker: "PETE", text: "What brings you around here, hon? Don't get many new faces in this town!" },
    // 1 — Ashley
    { img: "../../assets/images/scene3-counter3-02.jpg", speaker: "ASHLEY", text: "Oh, nothing much. Just an old missing persons case... hon." },
    // 2-4 — même image 03
    { img: "../../assets/images/scene3-counter3-03.jpg", speaker: "PETE", text: "Oh, you mean little Bliss, the one who disappeared back in '94? If you ask me, it was the stepfather! He showed up in town in '92 and wasted no time marrying Jodie Bliss, Melissa's mother. How they even met, no idea. Anyway, it's a secret he took to the grave with him." },
    { img: "../../assets/images/scene3-counter3-03.jpg", speaker: "ASHLEY", text: "Great. A first lead that goes nowhere... off to a good start.", tone: "mumble" },
    
    { img: "../../assets/images/scene3-counter3-04.jpg", speaker: "ASHLEY", text: "Hey...hmm...What's your name again...?" },
    // 5 — Pete
    { img: "../../assets/images/scene3-counter3-06.jpg", speaker: "PETE", text: "Pete. Name's Pete." },
    // 6 — Ashley
    { img: "../../assets/images/scene3-counter3-04.jpg", speaker: "ASHLEY", text: "Right, Pete. Do you happen to know a Seth? Fern?" },
    // 7 — Pete
    { img: "../../assets/images/scene3-counter3-03.jpg", speaker: "PETE", text: "Oh, Fern, sure — he runs the garage, Fern Auto Repair. Oh, right, he and Melissa were together. Poor guy looked devastated when he found out she'd disappeared." },
    // 8 — Ashley
    { img: "../../assets/images/scene3-counter3-07.jpg", speaker: "ASHLEY", text: "Devastated... I see.", tone: "mumble" },
    // 9 — Ashley
    { img: "../../assets/images/scene3-counter3-08.jpg", speaker: "ASHLEY", text: "And tell me, Pete, do you know if the garage is open tomorrow?" },
    // 10 — Pete
    { img: "../../assets/images/scene3-counter3-09.jpg", speaker: "PETE", text: "Ah, got a little problem with your... ride?" },
    // 11 — Ashley
    { img: "../../assets/images/scene3-counter3-07.jpg", speaker: "ASHLEY", text: "Yeah... something like that." },
    // 12-13 — Pete, image 06 réutilisée
    { img: "../../assets/images/scene3-counter3-02.jpg", speaker: "PETE", text: "Unfortunately, the garage is closed on weekends. But if it's an emergency, you can always go see Seth at his place." },
    { img: "../../assets/images/scene3-counter3-02.jpg", speaker: "PETE", text: "Try not to get him too worked up. He's in the middle of a divorce..." },
    // 14 — Ashley prend la serviette → Fern Auto Repair se débloque ici
    { img: "../../assets/images/scene3-counter3-04.jpg", speaker: "ASHLEY", text: "Great... I'll do that, then. Thanks." },
    // 15 — fausse sortie vers le motel (mémoire du corps)
    { img: "../../assets/images/scene3-counter3-10.jpg", speaker: "ASHLEY", text: "It's been a long day. Time to head back to the motel." }
  ];

  var PHONE_IMG = "../../assets/images/phone-frame.png";

  initSlideshow(SLIDES, {
    // Le texte dit "motel", mais le vrai lien mène ailleurs —
    // mémoire du corps, fil rouge inconscient d'Ashley.
    nextUrl: "../seth-3/",
    onSlideChange: function (index) {
      var items = [{ type: "report", label: "Case File #21071994", data: REPORT_DATA }].concat(BASE_LOCATIONS);
      var unlocked = index >= FERN_UNLOCK_INDEX;
      if (unlocked) items.push(FERN_LOCATION);

      initPhoneOverlay(items, {
        hasNew: index === FERN_UNLOCK_INDEX, // badge seulement au moment précis du déblocage
        newCount: 1,
        imgPath: PHONE_IMG
      });
    }
  });
</script>

</body>
</html>
