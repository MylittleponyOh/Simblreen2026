<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Factory — The Girl Who Went Missing</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/slideshow.css">
<link rel="stylesheet" href="../../assets/css/phone-overlay.css">
<link rel="stylesheet" href="../../assets/css/report-viewer.css">
</head>
<body>

<script src="../../assets/js/state.js"></script>
<script src="../../assets/js/slideshow.js"></script>
<script src="../../assets/js/phone-overlay.js"></script>
<script src="../../assets/js/report-viewer.js"></script>
<script>

  var REPORT_DATA = {
    title: "Case File #21071994/M-B",
    subtitle: "Melissa Bliss — Missing Person — Status: Closed (Unsolved)",
    sections: [
      {
        heading: "Incident Report",
        body: "July 21st, 1994, 00:04 — A call is received reporting the disappearance of Melissa Bliss, 23, reported missing by her mother Jodie Merrick. Melissa worked at a gas station in the neighboring town and usually ran home through the forest connecting the two areas, finishing her shift around 10 p.m. Official search efforts did not begin until 48 hours later, on 07/23/1994."
      },
      {
        heading: "Jodie Merrick (46) — Mother",
        body: "Nurse. Describes a conflicted relationship between Melissa and her stepfather, Garret Merrick, following a recent remarriage.",
        note: "The stepfather. Interesting…"
      },
      {
        heading: "Garret Merrick (52) — Stepfather",
        body: "Contractor. Confirms a distant relationship with Melissa, no open hostility. Describes Melissa and Seth's relationship as 'toxic.'",
        note: "Ah, so there was a boyfriend… but why is it Garret telling police Seth was toxic, and not Jodie?"
      },
      {
        heading: "Seth Fern (23) — Boyfriend",
        body: "Unemployed. Has known Melissa since childhood. Profile described as short-tempered and possessive. Admits to frequent arguments. Mentions a coworker (Leandro) he suspects of having feelings for Melissa. States Melissa always denied any relationship with him. Redirects investigators to Daphne Holzer for more information. Behavior during questioning: unusually composed.",
        note: "Unusually composed, apparently jealous and violent… Real son-in-law material, this one. (She sighs.)"
      },
      {
        heading: "Daphne Holzer (23) — Best Friend",
        body: "Waitress (evenings) and student (daytime). Close friend since childhood. Describes Seth as manipulative and jealous. Confirms Melissa mentioned Leandro Larozzi to her — alleged advances, unacknowledged mutual interest. According to Daphne, Melissa refused any relationship with Leandro because of how Seth would likely react.",
        note: "She knew more than she told the police. I'd bet my press badge on it."
      },
      {
        heading: "Leandro Larozzi (25) — Coworker",
        body: "Gas station employee and student. Admits having feelings for Melissa. States she turned him down because of her relationship with Seth. Describes Seth as unstable and intrusive (frequent presence at her workplace). States he tried to offer Melissa moral support.",
        note: "Five people interviewed. Three of them point straight at Seth Fern…"
      }
    ]
  };

  var IMG = "../../assets/images/";

  var CHOICE = GameState.flag("c1") ? 1 : (GameState.flag("c2") ? 2 : 0);

  // ── INTRO ───────────────────────────────────────────────
  var INTRO = [
    { img: IMG + "scene4-bar4-01.jpg", speaker: "PETE", text: "Well, if it isn't the little lady from last night!" },
    { img: IMG + "scene4-bar4-02.jpg", speaker: "ASHLEY", text: "Hi, Pete. I couldn't find Seth, but I did meet his wife, Linda..." },
    { img: IMG + "scene4-bar4-03.jpg", speaker: "PETE", text: "Ah... yeah... about that... he's right there." },
    { img: IMG + "scene4-bar4-04.jpg", speaker: "", text: "" },
    { img: IMG + "scene4-bar4-05.jpg", speaker: "ASHLEY", text: "That's clearly not Linda... That loser already looks drunk and it's only 11 a.m. Let's see if I can get something out of him...", tone: "whisper" },
    { img: IMG + "scene4-bar4-06.jpg", speaker: "", text: "" },
    { img: IMG + "scene4-bar4-07.jpg", speaker: "ASHLEY", text: "Hello, Mr... Fern?" },
    { img: IMG + "scene4-bar4-08.jpg", speaker: "SETH", text: "What do you want from me? Did Linda send you? What are you, a lawyer?" },
    {
      img: IMG + "scene4-bar4-08.jpg",
      speaker: "",
      text: "",
      choices: [
        { label: "Ask about Melissa", url: GameState.link("./", { flag: "c1" }) },
        { label: "Mention your car", url: GameState.link("./", { flag: "c2" }) }
      ]
    }
  ];

  // ── CHOIX 1 ─────────────────────────────────────────────
  var CHOICE1 = [
    { img: IMG + "scene4-bar4-c1-01.jpg", speaker: "ASHLEY", text: "I have some questions about Melissa Bliss." },
    { img: IMG + "scene4-bar4-c1-02.jpg", speaker: "", text: "" },
    { img: IMG + "scene4-bar4-c1-03.jpg", speaker: "SETH", text: "I've got nothing to say to you about her. Now get lost." },
    { img: IMG + "scene4-bar4-c1-04.jpg", speaker: "ASHLEY", text: "Okay... clearly a sore spot. I lacked tact. I won't get anything out of him now. Nice one, Morris... Really nice one.", tone: "whisper" }
  ];

  // ── CHOIX 2 ─────────────────────────────────────────────
  var CHOICE2 = [
    { img: IMG + "scene4-bar4-c2-01.jpg", speaker: "ASHLEY", text: "I'm having trouble with my car, and Pete recommended your... expertise." },
    { img: IMG + "scene4-bar4-c2-02.jpg", speaker: "", text: "" },
    { img: IMG + "scene4-bar4-c2-03.jpg", speaker: "SETH", text: "The garage is closed until Monday, but I can make an exception for a damsel in distress." },
    { img: IMG + "scene4-bar4-c2-04.jpg", speaker: "ASHLEY", text: "Judging by the state of the Ferns' house, he won't turn his nose up at a few simoleons.", tone: "whisper" },
    { img: IMG + "scene4-bar4-c2-03.jpg", speaker: "SETH", text: "Drop the car off at the garage within the hour." },
    { img: IMG + "scene4-bar4-c2-04.jpg", speaker: "ASHLEY", text: "Thank you, Mr Fern." },
    { img: IMG + "scene4-bar4-c2-03.jpg", speaker: "SETH", text: "Call me Seth." },
    { img: IMG + "scene4-bar4-c2-04.jpg", speaker: "ASHLEY", text: "Thanks, see you in an hour... Seth." }
  ];

  var LOCATIONS = [
    { type: "location", name: "Seth Fern's House", blurb: "", thumb: IMG + "map-icon.jpg", locked: true, lockedLabel: "Visited" },
    { type: "location", name: "The Factory", blurb: "Local Bar & Diner", thumb: IMG + "map-icon.jpg", url: "../bar-4/", current: true },
    { type: "location", name: "Copperdale National Forest", blurb: "", thumb: IMG + "map-icon.jpg", url: "../forest-4/" },
    { type: "location", name: "Gas Station", blurb: "", thumb: IMG + "map-icon.jpg", url: "../gas-station-4/" },
    { type: "location", name: "Copperdale Police Station", blurb: "", thumb: IMG + "map-icon.jpg", locked: true, lockedLabel: "Opens later" },
    { type: "location", name: "Fern Auto Repair", blurb: "Seth's garage", thumb: IMG + "map-icon.jpg", url: "../fern-4/", isNew: true }
  ];

  var PHONE_IMG = IMG + "phone-frame.png";

  var SLIDES = CHOICE === 1 ? CHOICE1 : (CHOICE === 2 ? CHOICE2 : INTRO);

  initSlideshow(SLIDES, {
    nextUrl: CHOICE === 1 ? GameState.link("../scene5/") : "#",
    onSlideChange: function (index) {
      if (CHOICE !== 2) return;
      if (index < SLIDES.length - 1) return;
      var items = GameState.items(
        [{ type: "report", label: "Case File #21071994", data: REPORT_DATA }].concat(LOCATIONS)
      );
      initPhoneOverlay(items, { hasNew: true, newCount: 1, imgPath: PHONE_IMG });
    }
  });
</script>

</body>
</html>
