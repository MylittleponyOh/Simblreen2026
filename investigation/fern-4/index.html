<!DOCTYPE html>
<html lang="en">
<head>

<title>Fern Auto Repair — The Girl Who Went Missing</title>

<body>

<script src="../../assets/js/state.js"></script>
<script src="../../assets/js/slideshow.js"></script>
<script src="../../assets/js/phone-overlay.js"></script>
<script src="../../assets/js/report-viewer.js"></script>
<script>

  var REPORT_DATA = {
    title: "Case File #21071994/M-B",
    subtitle: "Melissa Bliss — Missing Person — Status: Closed (Unsolved)",
    sections: [
      {
        heading: "Incident Report",
        body: "July 21st, 1994, 00:04 — A call is received reporting the disappearance of Melissa Bliss, 23, reported missing by her mother Jodie Merrick. Melissa worked at a gas station in the neighboring town and usually ran home through the forest connecting the two areas, finishing her shift around 10 p.m. Official search efforts did not begin until 48 hours later, on 07/23/1994."
      },
      {
        heading: "Jodie Merrick (46) — Mother",
        body: "Nurse. Describes a conflicted relationship between Melissa and her stepfather, Garret Merrick, following a recent remarriage.",
        note: "The stepfather. Interesting…"
      },
      {
        heading: "Garret Merrick (52) — Stepfather",
        body: "Contractor. Confirms a distant relationship with Melissa, no open hostility. Describes Melissa and Seth's relationship as 'toxic.'",
        note: "Ah, so there was a boyfriend… but why is it Garret telling police Seth was toxic, and not Jodie?"
      },
      {
        heading: "Seth Fern (23) — Boyfriend",
        body: "Unemployed. Has known Melissa since childhood. Profile described as short-tempered and possessive. Admits to frequent arguments. Mentions a coworker (Leandro) he suspects of having feelings for Melissa. States Melissa always denied any relationship with him. Redirects investigators to Daphne Holzer for more information. Behavior during questioning: unusually composed.",
        note: "Unusually composed, apparently jealous and violent… Real son-in-law material, this one. (She sighs.)"
      },
      {
        heading: "Daphne Holzer (23) — Best Friend",
        body: "Waitress (evenings) and student (daytime). Close friend since childhood. Describes Seth as manipulative and jealous. Confirms Melissa mentioned Leandro Larozzi to her — alleged advances, unacknowledged mutual interest. According to Daphne, Melissa refused any relationship with Leandro because of how Seth would likely react.",
        note: "She knew more than she told the police. I'd bet my press badge on it."
      },
      {
        heading: "Leandro Larozzi (25) — Coworker",
        body: "Gas station employee and student. Admits having feelings for Melissa. States she turned him down because of her relationship with Seth. Describes Seth as unstable and intrusive (frequent presence at her workplace). States he tried to offer Melissa moral support.",
        note: "Five people interviewed. Three of them point straight at Seth Fern…"
      }
    ]
  };

  var IMG = "../../assets/images/";
  var GIFT_URL = "#"; // GIFT URL !!!
  var SLIDES = [

    { img: IMG + "fern-auto-repair.jpg", speaker: "", text: "October 17th 2009, 12:00 - Fern Auto Repair, Copperdale" },
    { img: IMG + "scene4-fern4-01.jpg", speaker: "", text: "" },

    { img: IMG + "scene4-fern4-02.jpg", speaker: "SETH",   text: "Quite a car for a..." },
    { img: IMG + "scene4-fern4-03.jpg", speaker: "ASHLEY", text: "For a woman?" },
    { img: IMG + "scene4-fern4-04.jpg", speaker: "SETH",   text: "I was going to say for a... but actually, I don't know what you do for a living." },
    { img: IMG + "scene4-fern4-05.jpg", speaker: "ASHLEY", text: "For a journalist... I'm a journalist at the San Myshuno Inspector." },
    { img: IMG + "scene4-fern4-06.jpg", speaker: "SETH",   text: "San Myshuno... that's not exactly next door. So, what's wrong with your car?" },

    { img: IMG + "scene4-fern4-07.jpg", speaker: "ASHLEY", text: "... Damn... I didn't think this through... Think, Morris! ", tone: "whisper" },
    { img: IMG + "scene4-fern4-08.jpg", speaker: "ASHLEY", text: "It won't start... well, it doesn't always start." },

    { img: IMG + "scene4-fern4-09.jpg", speaker: "SETH",   text: "Ah... I'll take a look." },
    { img: IMG + "scene4-fern4-10.jpg", speaker: "SETH",   text: "So, what's a journalist doing in a backwater like Copperdale?" },

    { img: IMG + "scene4-fern4-11.jpg", speaker: "ASHLEY", text: "I'm writing an article on the local police." },
    { img: IMG + "scene4-fern4-10.jpg", speaker: "SETH", text: "...cough...", tone: "mumble" },
    { img: IMG + "scene4-fern4-11.jpg", speaker: "ASHLEY", text: "Do you know the Melissa Bliss case?" },

    { img: IMG + "scene4-fern4-12.jpg", speaker: "SETH",   text: "You read the file, didn't you? You don't have any car trouble at all, do you?" },
    { img: IMG + "scene4-fern4-13.jpg", speaker: "ASHLEY", text: "Yes, I read the file... Listen, Seth..." },

    { img: IMG + "scene4-fern4-14.jpg", speaker: "SETH",   text: "I'VE GOT NOTHING TO SAY TO YOU! IF YOU'VE READ THE FILES, THEN GO TALK TO THE OTHERS!" }, 
    { img: IMG + "scene4-fern4-15.jpg", speaker: "SETH",   text: "NOW GET THE FUCK OUT! You've wasted enough of my time." },
    { img: IMG + "scene4-fern4-16.jpg", speaker: "",   text: "" },

    { img: IMG + "scene4-fern4-17.jpg", speaker: "",   text: "" },

    { img: IMG + "scene4-fern4-18.jpg", speaker: "ASHLEY", text: "Who in this damn town is finally going to talk to me about this case?", tone: "whisper" }
  ];

  var LOCATIONS = [
    { type: "location", name: "Seth Fern's House", blurb: "", thumb: IMG + "map-icon.jpg", locked: true, lockedLabel: "Visited" },
    { type: "location", name: "The Factory", blurb: "Local Bar & Diner", thumb: IMG + "map-icon.jpg", locked: true, lockedLabel: "Visited" },
    { type: "location", name: "Copperdale National Forest", blurb: "", thumb: IMG + "map-icon.jpg", url: "../forest-4/" },
    { type: "location", name: "Gas Station", blurb: "", thumb: IMG + "map-icon.jpg", url: "../gas-station-4/" },
    { type: "location", name: "Copperdale Police Station", blurb: "", thumb: IMG + "map-icon.jpg", url: "../police-station-5/", isNew: true },
    { type: "location", name: "Fern Auto Repair", blurb: "Seth's garage", thumb: IMG + "map-icon.jpg", url: "../fern-4/", current: true }
  ];

  var PHONE_IMG = IMG + "phone-frame.png";

  var MESSAGES = [
    { type: "message", from: "MIKE",   text: "Everything alright?" },
    { type: "message", from: "ASHLEY", text: "Have you ever had car keys thrown in your face?" },
    { type: "message", from: "MIKE",   text: "Damn! Are you okay? Looks like you dug up a file somebody doesn't want to see resurface!!!" },
    {
      type: "message",
      from: "ASHLEY",
      text: "Clearly! And no, not a scratch! Queen of the dodge.",
      attachment: { label: "Catch the keys", url: GIFT_URL }
    }
  ];

  initSlideshow(SLIDES, {
    nextUrl: "#",
    onSlideChange: function (index) {
      var last = SLIDES.length - 1;

      if (index === last - 1) {
        initPhoneOverlay(MESSAGES, { hasNew: true, newCount: MESSAGES.length, imgPath: PHONE_IMG });
        return;
      }

      if (index === last) {
        var items = GameState.items(
          MESSAGES.concat([{ type: "report", label: "Case File #21071994", data: REPORT_DATA }], LOCATIONS),
          { flag: "police" }
        );
        initPhoneOverlay(items, { hasNew: true, newCount: 1, imgPath: PHONE_IMG });
      }
    }
  });
</script>

</body>
</html>
