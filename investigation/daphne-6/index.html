<title>Daphne - The Girl Who Went Missing</title>

<script>

  var IMG = "../../assets/images/";

  var SLIDES = [
    // PORCH
    { img: IMG + "daphne-01.jpg", speaker: "", text: "" },
    { img: IMG + "daphne-02.jpg", speaker: "", text: "" },
    { img: IMG + "daphne-03.jpg", speaker: "ASHLEY", text: "Hello, are you Daphne Holzer?", fr: "Bonjour, vous êtes Daphne Holzer ?" },
    { img: IMG + "daphne-03.jpg", speaker: "DAPHNE", text: "It's been a few years since anyone called me that. But yes, that's me.", fr: "Ça fait quelques années que personne ne m’a appelée comme ça. Mais oui, c’est moi." },
    { img: IMG + "daphne-04.jpg", speaker: "ASHLEY", text: "I'm Ashley Morris-Wint, a journalist at the San Myshuno Inspector. I'm here on behalf of Mrs. Merrick, about the disappearance of-", fr: "Je suis Ashley Morris-Wint, journaliste au San Myshuno Inspector. Je viens de la part de Mme Merrick, au sujet de la disparition de-" },
    { img: IMG + "daphne-04.jpg", speaker: "DAPHNE", text: "Melissa. Of course.", fr: "Melissa. Bien sûr." },
    { img: IMG + "daphne-05.jpg", speaker: "DAPHNE", text: "I don't want Josh and the kids to hear this. I have some errands to run, do you mind coming along? We can talk on the way.", fr: "Je ne veux pas que Josh et les enfants entendent ça. J’ai des courses à faire, ça vous dérange de m’accompagner ? On pourra parler sur la route." },

    // GAS STATION / DINER
    { img: IMG + "daphne-06.jpg", speaker: "", text: "" },
    { img: IMG + "daphne-07.jpg", speaker: "", text: "" },    
    { img: IMG + "daphne-08.jpg", speaker: "ASHLEY", text: "I went back over the report.", fr: "J’ai relu le rapport." },
    { img: IMG + "daphne-09.jpg", speaker: "DAPHNE", text: "And you saw that something was off, didn't you?", fr: "Et vous avez vu que quelque chose clochait, n’est-ce pas ?" },
    { img: IMG + "daphne-10.jpg", speaker: "ASHLEY", text: "Exactly. I also read this.", fr: "Exactement. J’ai aussi lu ceci." },
    { img: IMG + "daphne-10.jpg", speaker: "ASHLEY", text: "And I understood you knew much more than what you told the police in 1994. I wonder why you never mentioned the breakup Melissa was planning the night she disappeared.", fr: "Et j’ai compris que vous en saviez bien plus que ce que vous avez dit à la police en 1994. Je me demande pourquoi vous n’avez jamais parlé de la rupture que Melissa prévoyait la nuit de sa disparition." },
    { img: IMG + "daphne-11.jpg", speaker: "DAPHNE", text: "Do you know who the police captain was in 1994?", fr: "Savez-vous qui était le capitaine de police en 1994 ?" },
    { img: IMG + "daphne-12.jpg", speaker: "ASHLEY", text: "Would I have missed such a crucial piece of information?", fr: "Aurais-je pu passer à côté d’une information aussi cruciale ?" },
    { img: IMG + "daphne-13.jpg", speaker: "DAPHNE", text: "It was Capt. J.G. Fern... The... father...", fr: "C’était le capitaine J.G. Fern... Le... père..." },
    { img: IMG + "daphne-12.jpg", speaker: "ASHLEY", text: "...of Seth Fern! Good grief!", fr: "...de Seth Fern ! Bon sang !" },
    { img: IMG + "daphne-13.jpg", speaker: "DAPHNE", text: "You've read it, Seth wasn't a good person. And that night, I'm convinced he was the worst version of himself.", fr: "Vous l’avez lu, Seth n’était pas quelqu’un de bien. Et cette nuit-là, je suis convaincue qu’il a été la pire version de lui-même." },
    { img: IMG + "daphne-14.jpg", speaker: "ASHLEY", text: "What aren't you telling me, Daphne? Why protecting Seth?", fr: "Qu’est-ce que vous ne me dites pas, Daphne ? Pourquoi protéger Seth ?" },
    { img: IMG + "daphne-11.jpg", speaker: "DAPHNE", text: "It's not him I've been protecting for fifteen years.", fr: "Ce n’est pas lui que je protège depuis quinze ans." },
    { img: IMG + "daphne-15.jpg", speaker: "ASHLEY", text: "I... I don't understand. Is Melissa still alive?", fr: "Je... Je ne comprends pas. Melissa est-elle toujours en vie ?" },
    { img: IMG + "daphne-13.jpg", speaker: "DAPHNE", text: "The best thing is to show you.", fr: "Le mieux, c’est de vous montrer." },
    { img: IMG + "daphne-16.jpg", speaker: "", text: ""},

    // FOREST EDGE
    { img: IMG + "daphne-17.jpg", speaker: "", text: "" },
    { img: IMG + "daphne-17.jpg", speaker: "DAPHNE", text: "Something's off.", fr: "Il y a un problème." },
    { img: IMG + "daphne-18.jpg", speaker: "DAPHNE", text: "Damn it, no way. My tire's flat! I have a spare, I'll change it, do you mind?", fr: "C’est pas vrai ! J’ai un pneu à plat ! J’ai une roue de secours, je vais la changer, ça ne vous dérange pas ?" },
    {
  img: IMG + "daphne-18.jpg",
  lines: [
    { speaker: "ASHLEY", text: "I'd like to help but I'm not much of a mechanic. Do you mind if I take a walk?", fr: "J’aimerais vous aider, mais je ne suis pas très bonne mécanicienne. Ça vous dérange si je vais faire un tour ?" },
    { speaker: "DAPHNE", text: "No problem. It's getting cold, grab a coat in the backseat!", fr: "Pas de souci. Il commence à faire froid, prenez un manteau sur la banquette arrière !" }
  ]
},
    { img: IMG + "daphne-19.jpg", speaker: "", text: "" },
  ];

  Lang.slides(SLIDES);

  initSlideshow(SLIDES, {
    nextUrl: "../forest-6/"
  });

</script>
