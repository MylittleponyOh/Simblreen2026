<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Girl Who Went Missing</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="hero">
  <p class="subtitle">15 years unsolved. One reporter refuses to close the file.</p>

  <div class="countdown" id="countdown">
    <div class="unit"><span class="value" id="cd-days">--</span><span class="label">Days</span></div>
    <div class="unit"><span class="value" id="cd-hours">--</span><span class="label">Hours</span></div>
    <div class="unit"><span class="value" id="cd-minutes">--</span><span class="label">Min</span></div>
    <div class="unit"><span class="value" id="cd-seconds">--</span><span class="label">Sec</span></div>
  </div>
  <p class="closed-note" id="closed-note">Case file sealed until then</p>

  <a href="investigation/" class="cta" id="enter-btn">Enter the Investigation</a>
</div>

<script src="assets/js/countdown.js"></script>

</body>
</html>
